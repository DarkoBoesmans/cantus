<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Drankenkaart A4 | Brouwerij Vopop</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #bbb; color: var(--navy); }
  .blad { width: 210mm; height: 297mm; margin: 0 auto; background: var(--papier); position: relative; overflow: hidden; padding: 13mm 16mm 0; }
  .kader { position: absolute; inset: 6mm; border: 1.4mm solid var(--navy); pointer-events: none; }
  .kader::after { content: ""; position: absolute; inset: 1.2mm; border: .3mm solid var(--navy); }

  .uithang { font-size: 13pt; }
  .kaart { display: grid; grid-template-columns: 1fr 1fr; column-gap: 10mm; margin-top: 4mm; font-size: 11pt; align-items: start; }
  .rubriek { margin-bottom: 3.2mm; }
  .rubriek h2 { margin-bottom: .8mm; }
  .bier { padding: .25mm 0; }
  .bier .prijs { font-size: 10.6pt; }

  .voet { position: absolute; left: 16mm; right: 16mm; bottom: 12mm; display: flex; gap: 6mm; align-items: stretch; font-size: 10pt; }
  .verhaal { flex: 1; padding: 3.5mm 4.5mm; }
  .verhaal h3 { font-size: 11.5pt; }
  .verhaal p { font-size: 9.6pt; line-height: 1.38; }
  .verhaal .adres { font-family: var(--caps); font-style: normal; font-weight: 600; font-size: 8.5pt; letter-spacing: .12em; margin-top: 2mm; }
  .qr { width: 35mm; background: var(--navy); color: #fff; text-align: center; padding: 3mm 3mm 2mm; }
  .qr .vak { background: var(--papier); padding: 1.6mm; }
  .qr img { width: 100%; display: block; }
  .qr p { font-family: var(--slab); font-weight: 700; font-size: 9.5pt; letter-spacing: .1em; margin: 1.8mm 0 0; }
</style>
</head>
<body>
<div class="blad">
  <div class="kader"></div>
  <header class="uithang">
    <p class="klein">CAFÉ &amp; BROUWERIJ · GIJZEGEM</p>
    <p class="brouwerij">Brouwerij</p>
    <h1 class="vopop">VOPOP</h1>
    <div class="lint"><span>DRANKENKAART</span></div>
    <div class="onder"><span class="open">ZONDAG (MEESTAL) OPEN</span><span class="slogan">met één P</span><span></span></div>
    <div class="dubbel"></div>
  </header>
  <main class="kaart"><div id="links"></div><div id="rechts"></div></main>
  <div class="voet">
    <div class="verhaal">
      <h3>Een woordje van de cafébazen</h3>
      <p id="verhaal"></p>
      <p class="adres" id="adres"></p>
    </div>
    <div class="qr"><div class="vak"><img src="qr.svg" alt="QR-code naar de online drankenkaart"></div><p>SCAN DE KAART</p></div>
  </div>
</div>
<script src="menu.js"></script>
<script>
  if (new URLSearchParams(location.search).get("qr") === "0") document.querySelector(".qr").remove();
  var M = window.VOPOP, kol = { links: "", rechts: "" }, links = ["dag", "vat", "pils", "wit", "blond"], rechts = ["fruit", "sterk", "trappist", "donker", "muts"];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var volgorde = links.concat(rechts);
  volgorde.forEach(function (id) {
    var r = M.rubrieken.filter(function (x) { return x.id === id; })[0];
    var h = '<section class="rubriek"><h2>' + esc(r.naam) + "</h2>";
    r.bieren.forEach(function (b) {
      h += '<div class="bier lijn"><span class="naam">' + esc(b.bier) + '</span><span class="punten"></span>' +
           '<span class="prijs' + (typeof b.prijs === "number" ? "" : " raar") + '">' + esc(M.prijsTekst(b.prijs)) + "</span></div>";
    });
    kol[links.indexOf(id) >= 0 ? "links" : "rechts"] += h + "</section>";
  });
  document.getElementById("links").innerHTML = kol.links;
  document.getElementById("rechts").innerHTML = kol.rechts;
  document.getElementById("verhaal").textContent = M.verhaal;
  document.getElementById("adres").textContent = "@CHIROPOPOV · " + M.adres.toUpperCase();
</script>
</body>
</html>
