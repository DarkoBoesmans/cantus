<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Drankenkaart A4 | Brouwerij Vopop</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #ccc; font-family: var(--tekst); color: var(--navy); }
  .blad { width: 210mm; height: 297mm; margin: 0 auto; background: var(--wit); position: relative; overflow: hidden; padding: 11mm 14mm 0; }

  .top { display: flex; justify-content: space-between; font-family: var(--cond); font-weight: 600; font-size: 9pt; letter-spacing: .12em; text-transform: uppercase; }
  .kop { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 6mm; margin-top: 4mm; }
  .voor { font-family: var(--cond); font-weight: 700; font-size: 15pt; letter-spacing: .16em; text-transform: uppercase; margin: 0 0 1.5mm; }
  h1.bord { font-size: 96pt; margin-left: -.6mm; }
  .rechts { padding-bottom: 3mm; text-align: right; }
  .rechts .lint { font-size: 12pt; margin-right: 9mm; }
  .rechts .lint > span { padding: 2.2mm 6mm 2mm; }
  .slogan { font-family: var(--cond); font-weight: 600; font-size: 13pt; margin: 5mm 0 0; }
  .slogan b { color: var(--rood); }
  .streep { height: .8mm; background: var(--navy); margin-top: 4mm; }

  .kaart { display: grid; grid-template-columns: 1fr 1fr; column-gap: 9mm; margin-top: 5mm; align-items: start; }
  section { margin-bottom: 3.6mm; }
  .rub { display: flex; align-items: center; gap: 2.2mm; padding-bottom: 1.2mm; border-bottom: .5mm solid var(--navy); margin-bottom: .6mm; }
  .rub .tegel { width: 7mm; height: 7mm; }
  .rub h2 { font-size: 17pt; }
  .bier { padding: .5mm 0; }
  .bier .naam { font-size: 12pt; }
  .bier .prijs { font-size: 12pt; }
  .bier .lied { font-size: 8.5pt; color: rgba(0,18,77,.7); margin-top: -.6mm; }

  .voet { position: absolute; left: 14mm; right: 14mm; bottom: 11mm; display: flex; gap: 5mm; align-items: stretch; }
  .verhaal { flex: 1; background: var(--schuim); padding: 4mm 5mm; }
  .verhaal h3 { font-family: var(--cond); font-weight: 700; font-size: 12pt; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 1mm; }
  .verhaal p { margin: 0; font-size: 9.6pt; line-height: 1.4; }
  .verhaal .adres { font-family: var(--cond); font-weight: 600; letter-spacing: .1em; font-size: 8.5pt; text-transform: uppercase; margin-top: 2mm; }
  .qr { width: 36mm; background: var(--navy); color: #fff; text-align: center; padding: 3mm 3mm 2.2mm; }
  .qr .vak { background: #fff; padding: 1.6mm; }
  .qr img { width: 100%; display: block; }
  .qr p { font-family: var(--cond); font-weight: 700; font-size: 11pt; letter-spacing: .08em; margin: 1.8mm 0 0; text-transform: uppercase; }
</style>
</head>
<body>
<div class="blad">
  <div class="top"><span>Café &amp; brouwerij, Gijzegem</span><span>@chiropopov</span></div>
  <div class="kop">
    <div>
      <p class="voor">Brouwerij</p>
      <h1 class="bord">Vopop</h1>
    </div>
    <div class="rechts">
      <div class="lint"><span>Drankenkaart</span></div>
      <p class="slogan">Met <b>één</b> P. Zondag (meestal) open.</p>
    </div>
  </div>
  <div class="streep"></div>
  <main class="kaart"><div id="links"></div><div id="rechts"></div></main>
  <div class="voet">
    <div class="verhaal">
      <h3>Een woordje van de cafébazen</h3>
      <p id="verhaal"></p>
      <p class="adres" id="adres"></p>
    </div>
    <div class="qr"><div class="vak"><img src="qr.svg" alt="QR-code naar de online drankenkaart"></div><p>Scan &amp; tap</p></div>
  </div>
</div>
<script src="menu.js"></script>
<script>
  var M = window.VOPOP, kol = { links: "", rechts: "" }, links = ["vat", "dag", "pils", "wit", "blond"];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  M.rubrieken.forEach(function (r) {
    var h = '<section><div class="rub"><span class="tegel"><svg viewBox="0 0 24 24">' + M.iconen[r.id] + '</svg></span><h2 class="bord">' + esc(r.naam) + "</h2></div>";
    r.bieren.forEach(function (b) {
      h += '<div class="bier"><div class="lijn"><span class="naam">' + esc(b.bier) + '</span><span class="punten"></span>' +
           '<span class="prijs' + (typeof b.prijs === "number" ? "" : " raar") + '">' + esc(M.prijsTekst(b.prijs)) + "</span></div></div>";
    });
    kol[links.indexOf(r.id) >= 0 ? "links" : "rechts"] += h + "</section>";
  });
  document.getElementById("links").innerHTML = kol.links;
  document.getElementById("rechts").innerHTML = kol.rechts;
  document.getElementById("verhaal").textContent = M.verhaal;
  document.getElementById("adres").textContent = M.adres;
</script>
</body>
</html>
