<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drankenkaart | Brouwerij Vopop</title>
<meta name="description" content="De drankenkaart van Brouwerij Vopop: kies een Belgisch bier, bestel het en zing het chiroliedje dat erbij hoort.">
<meta name="theme-color" content="#FFFFFF">
<link rel="canonical" href="https://darkoboesmans.github.io/cantus/">
<meta property="og:title" content="Drankenkaart | Brouwerij Vopop">
<meta property="og:description" content="Kies een bier, bestel het en zing het lied dat erbij hoort.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://darkoboesmans.github.io/cantus/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23E1143C%22/%3E%3Ctext x=%2216%22 y=%2226%22 font-size=%2226%22 font-family=%22Impact%22 fill=%22%23fff%22 text-anchor=%22middle%22%3EV%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--wit); color: var(--navy); font-family: var(--tekst); font-size: 17px; line-height: 1.5; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--navy); }
  :focus-visible { outline: 3px solid var(--rood); outline-offset: 3px; }
  .skip { position: absolute; left: 12px; top: -60px; background: var(--navy); color: #fff; padding: 8px 14px; z-index: 50; font-family: var(--cond); font-weight: 700; }
  .skip:focus { top: 12px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px 0; max-width: 640px; margin: 0 auto;
    font-family: var(--cond); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
  .top .tafel { background: var(--navy); color: #fff; padding: 3px 10px; }

  .hero { padding-top: 26px; padding-bottom: 10px; }
  .hero .voor { font-family: var(--cond); font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 6px; }
  .hero h1 { font-size: clamp(110px, 38vw, 232px); margin-left: -.03em; }
  .hero .lint { margin: 22px 0 0 18px; font-size: 18px; }
  .hero .lint > span { padding: 8px 22px 7px; }
  .hero .slogan { font-family: var(--cond); font-weight: 600; font-size: 24px; margin: 16px 0 0; }
  .hero .slogan b { color: var(--rood); font-weight: 700; }

  .verhaal { background: var(--schuim); padding: 18px 20px; margin: 24px 0 0; }
  .verhaal h2 { font-family: var(--cond); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px; }
  .verhaal p { margin: 0; }

  nav { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.96); border-bottom: 2px solid var(--navy); margin-top: 26px; }
  nav ul { list-style: none; margin: 0 auto; padding: 12px 20px 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; max-width: 640px; align-items: flex-end; }
  nav ul::-webkit-scrollbar { display: none; }
  nav a {
    position: relative; overflow: hidden; display: flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none;
    background: var(--navy); color: #fff; font-family: var(--cond); font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase;
    padding: 10px 13px 9px 9px; border-radius: 14px 14px 0 0; min-height: 44px; transition: padding-bottom .25s ease;
  }
  nav a .tegel { width: 24px; height: 24px; }
  nav a::after { content: ""; position: absolute; inset: 0; background: var(--rood); transform: scaleY(0); transform-origin: bottom; transition: transform .3s cubic-bezier(.3,.7,.2,1); z-index: 0; }
  nav a > * { position: relative; z-index: 1; }
  nav a:hover::after, nav a.actief::after { transform: scaleY(1); }
  nav a.actief { padding-bottom: 15px; }
  nav a.actief .tegel, nav a:hover .tegel { background: var(--navy); }

  section.rubriek { padding-top: 34px; scroll-margin-top: 70px; }
  .kop { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--navy); }
  .kop .tegel { width: 46px; height: 46px; }
  .kop h2 { font-size: 46px; }
  .bier { padding: 14px 0 15px; border-bottom: 1px solid var(--lijn); }
  .bier h3 { margin: 0; font-size: 25px; line-height: 1.1; }
  .bier .prijs { font-size: 23px; }
  .meta { font-family: var(--cond); font-weight: 500; font-size: 16px; letter-spacing: .02em; color: rgba(0,18,77,.75); margin-top: 3px; }
  .meta b { font-weight: 700; color: var(--navy); }
  .onder { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: 4px; }
  .uitleg { font-style: italic; margin: 0; font-size: 16.5px; }

  .tap {
    position: relative; overflow: hidden; flex: none; display: inline-flex; align-items: center; gap: 7px;
    background: var(--wit); border: 2px solid var(--navy); color: var(--navy); min-height: 40px;
    font-family: var(--cond); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 13px 5px;
  }
  .tap::before { content: ""; position: absolute; inset: 0; background: var(--rood); transform: scaleY(0); transform-origin: bottom; transition: transform .32s cubic-bezier(.3,.7,.2,1); }
  .tap > * { position: relative; }
  .tap:hover::before, .tap:focus-visible::before, .tap.vol::before { transform: scaleY(1); }
  .tap:hover, .tap:focus-visible, .tap.vol { color: #fff; border-color: var(--rood); }
  .tap:active { translate: 0 2px; }
  .tap .n { background: #fff; color: var(--rood); min-width: 22px; text-align: center; padding: 0 5px; }

  footer { padding: 46px 0 150px; font-family: var(--cond); font-weight: 600; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; }
  footer p { margin: 3px 0; }
  footer a { text-underline-offset: 3px; }

  .balk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); transform: translateY(120%); transition: transform .35s cubic-bezier(.3,.7,.2,1); }
  .balk.toon { transform: none; }
  .balk button {
    display: flex; align-items: center; gap: 14px; width: 100%; max-width: 616px; margin: 0 auto; text-align: left;
    background: var(--navy); color: #fff; border: 0; padding: 10px 18px 10px 14px; font-family: var(--cond); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase;
  }
  .balk button:hover .glas, .balk button:focus-visible .glas { rotate: -8deg; }
  .balk .tekst { flex: 1; }
  .balk .totaal { color: var(--schuim); }
  .glas { position: relative; width: 30px; height: 42px; flex: none; transition: rotate .3s ease; }
  .glas svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .glas .bier-vul { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .6s cubic-bezier(.3,.7,.2,1); }
  .glas .bubbel { fill: #fff; opacity: .8; animation: stijg 2.6s linear infinite; }
  .glas .bubbel:nth-of-type(2) { animation-delay: -1.3s; }
  @keyframes stijg { from { transform: translateY(0); opacity: 0; } 20% { opacity: .8; } to { transform: translateY(-22px); opacity: 0; } }

  dialog { border: 0; padding: 0; width: 100%; max-width: 640px; max-height: 88vh; margin: auto auto 0; background: var(--wit); color: var(--navy); border-top: 6px solid var(--rood); }
  dialog::backdrop { background: rgba(0,18,77,.55); }
  .blad { padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); }
  .blad h2 { font-size: 46px; margin: 0 0 8px; }
  .blad .sub { margin: 0 0 10px; }
  .regel { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--lijn); }
  .regel .naam { font-size: 21px; }
  .aantal { display: flex; align-items: center; gap: 6px; }
  .aantal button { width: 40px; height: 40px; border: 2px solid var(--navy); background: #fff; font-family: var(--cond); font-weight: 700; font-size: 22px; line-height: 1; }
  .aantal button:hover { background: var(--navy); color: #fff; }
  .aantal output { min-width: 24px; text-align: center; font-family: var(--cond); font-weight: 700; font-size: 20px; }
  .som { display: flex; justify-content: space-between; font-family: var(--cond); font-weight: 700; font-size: 24px; text-transform: uppercase; padding: 14px 0 4px; }
  .knoppen { display: flex; gap: 10px; margin-top: 14px; }
  .knoppen .tap { flex: 1; justify-content: center; min-height: 50px; font-size: 19px; }
  .knoppen .hoofd { background: var(--rood); color: #fff; border-color: var(--rood); }
  .knoppen .hoofd::before { background: var(--navy); }
  ol.zing { padding-left: 24px; margin: 4px 0 0; font-family: var(--cond); font-size: 21px; font-weight: 700; text-transform: uppercase; }
  ol.zing li { margin: 8px 0; }
  ol.zing small { display: block; font-family: var(--tekst); font-weight: 400; font-size: 15px; text-transform: none; color: rgba(0,18,77,.75); }

  @media (min-width: 700px) { .hero h1 { font-size: 232px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<a class="skip" href="#kaart">Naar de drankenkaart</a>
<div class="top"><span>Café &amp; brouwerij, Gijzegem</span><span id="tafel">@chiropopov</span></div>

<header class="wrap hero">
  <p class="voor">Brouwerij</p>
  <h1 class="bord">Vopop</h1>
  <div class="lint"><span>Drankenkaart</span></div>
  <p class="slogan">Met <b>één</b> P. Zondag (meestal) open.</p>
  <div class="verhaal">
    <h2>Een woordje van de cafébazen</h2>
    <p id="verhaal"></p>
  </div>
</header>

<nav aria-label="Rubrieken"><ul id="nav"></ul></nav>

<main class="wrap" id="kaart" tabindex="-1"></main>

<footer class="wrap">
  <p>@chiropopov</p>
  <p id="adres"></p>
  <p><a href="menu.pdf">Drankenkaart als PDF</a></p>
</footer>

<div class="balk" id="balk">
  <button type="button" id="open">
    <span class="glas" aria-hidden="true">
      <svg viewBox="0 0 30 42">
        <defs><clipPath id="binnen"><path d="M4 6h22l-2.4 33H6.4z"/></clipPath></defs>
        <g clip-path="url(#binnen)">
          <rect class="bier-vul" id="vul" x="0" y="6" width="30" height="36" fill="#E4D096"/>
          <circle class="bubbel" cx="12" cy="36" r="1.4"/><circle class="bubbel" cx="18" cy="38" r="1.1"/>
        </g>
        <path d="M4 6h22l-2.4 33H6.4z" fill="none" stroke="#fff" stroke-width="2"/>
      </svg>
    </span>
    <span class="tekst" id="balkTekst">Bestelling</span><span class="totaal" id="balkTotaal"></span>
  </button>
</div>

<dialog id="bestelling" aria-labelledby="bestelTitel"><div class="blad" id="blad"></div></dialog>

<script src="menu.js"></script>
<script>
(function () {
  var M = window.VOPOP, $ = function (id) { return document.getElementById(id); };
  var alle = {}; M.rubrieken.forEach(function (r) { r.bieren.forEach(function (b, i) { b.id = r.id + i; alle[b.id] = b; }); });
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function tegel(id) { return '<span class="tegel" aria-hidden="true"><svg viewBox="0 0 24 24">' + (M.iconen[id] || "") + "</svg></span>"; }
  function euro(n) { return "€ " + n.toFixed(2).replace(".", ","); }

  var tafel = new URLSearchParams(location.search).get("tafel");
  if (tafel) { $("tafel").textContent = "Tafel " + String(tafel).replace(/[^0-9a-zA-Z]/g, "").slice(0, 4); $("tafel").className = "tafel"; }
  $("verhaal").textContent = M.verhaal;
  $("adres").textContent = M.adres;

  var mand = {};
  try { mand = JSON.parse(localStorage.getItem("vopop-mand") || "{}") || {}; } catch (e) { mand = {}; }
  function bewaar() { try { localStorage.setItem("vopop-mand", JSON.stringify(mand)); } catch (e) {} }

  var nav = "", kaart = "";
  M.rubrieken.forEach(function (r) {
    nav += '<li><a href="#' + r.id + '" data-r="' + r.id + '">' + tegel(r.id) + "<span>" + esc(r.naam) + "</span></a></li>";
    kaart += '<section class="rubriek" id="' + r.id + '" aria-labelledby="h-' + r.id + '"><div class="kop">' + tegel(r.id) + '<h2 class="bord" id="h-' + r.id + '">' + esc(r.naam) + "</h2></div>";
    r.bieren.forEach(function (b) {
      kaart += '<article class="bier"><div class="lijn"><h3 class="naam">' + esc(b.bier) + '</h3><span class="punten" aria-hidden="true"></span>' +
        '<span class="prijs' + (typeof b.prijs === "number" ? "" : " raar") + '">' + esc(M.prijsTekst(b.prijs)) + "</span></div>" +
        '<div class="meta">Lied: <b>' + esc(b.lied) + "</b>, " + esc(b.stijl.toLowerCase()) + "</div>" +
        '<div class="onder"><p class="uitleg">' + esc(b.uitleg) + "</p>" +
        '<button type="button" class="tap" data-id="' + b.id + '" aria-label="Tap een ' + esc(b.bier) + '"><span>Tap</span></button></div></article>';
    });
    kaart += "</section>";
  });
  $("nav").innerHTML = nav; $("kaart").innerHTML = kaart;

  function teken() {
    var stuks = 0, totaal = 0;
    Object.keys(mand).forEach(function (id) { if (!alle[id] || !(mand[id] > 0)) { delete mand[id]; return; } stuks += mand[id]; totaal += mand[id] * (typeof alle[id].prijs === "number" ? alle[id].prijs : 0); });
    document.querySelectorAll(".tap[data-id]").forEach(function (k) {
      var n = mand[k.dataset.id] || 0;
      k.classList.toggle("vol", n > 0);
      k.innerHTML = n ? '<span>Tap</span><span class="n">' + n + "</span>" : "<span>Tap</span>";
    });
    $("balk").classList.toggle("toon", stuks > 0);
    $("balkTekst").textContent = "Bestelling (" + stuks + ")";
    $("balkTotaal").textContent = euro(totaal);
    $("vul").style.transform = "scaleY(" + Math.min(1, .15 + stuks * .12) + ")";
    bewaar();
    return { stuks: stuks, totaal: totaal };
  }
  document.addEventListener("click", function (e) {
    var k = e.target.closest(".tap[data-id]"); if (!k) return;
    mand[k.dataset.id] = (mand[k.dataset.id] || 0) + 1; teken();
  });

  var dlg = $("bestelling");
  function toonBestelling() {
    var t = teken(), html = '<h2 class="bord" id="bestelTitel">Je bestelling</h2><p class="sub">Elke prijs is een bladzijde in het zangboekje.</p>';
    Object.keys(mand).forEach(function (id) {
      var b = alle[id];
      html += '<div class="regel"><div><div class="naam">' + esc(b.bier) + '</div><div class="meta">' + esc(b.lied) + ", " + esc(M.prijsTekst(b.prijs)) + "</div></div>" +
        '<div class="aantal"><button type="button" data-min="' + id + '" aria-label="Eén ' + esc(b.bier) + ' minder">−</button><output>' + mand[id] + '</output><button type="button" data-meer="' + id + '" aria-label="Eén ' + esc(b.bier) + ' meer">+</button></div></div>';
    });
    html += '<div class="som"><span>Totaal</span><span>' + euro(t.totaal) + "</span></div>" +
      '<div class="knoppen"><button type="button" class="tap" data-sluit><span>Verder kiezen</span></button><button type="button" class="tap hoofd" data-plaats><span>Bestelling plaatsen</span></button></div>';
    $("blad").innerHTML = html;
  }
  function toonBevestiging() {
    var html = '<h2 class="bord" id="bestelTitel">Getapt!</h2><p class="sub">De cafébazen schenken in. Zing je bestelling in deze volgorde:</p><ol class="zing">';
    Object.keys(mand).forEach(function (id) {
      var b = alle[id];
      html += "<li>" + esc(b.lied) + (mand[id] > 1 ? " × " + mand[id] : "") + "<small>" + esc(b.bier) + (typeof b.prijs === "number" ? ", bladzijde " + b.prijs : "") + "</small></li>";
    });
    html += '</ol><div class="knoppen"><button type="button" class="tap hoofd" data-nieuw><span>Nieuwe bestelling</span></button></div>';
    $("blad").innerHTML = html;
  }
  $("open").addEventListener("click", function () { toonBestelling(); dlg.showModal(); });
  dlg.addEventListener("click", function (e) {
    var t = e.target.closest("button") || e.target;
    if (e.target === dlg || t.hasAttribute("data-sluit")) { dlg.close(); return; }
    if (t.dataset.min) { mand[t.dataset.min]--; if (!(mand[t.dataset.min] > 0)) delete mand[t.dataset.min]; if (Object.keys(mand).length) toonBestelling(); else { teken(); dlg.close(); } return; }
    if (t.dataset.meer) { mand[t.dataset.meer]++; toonBestelling(); return; }
    if (t.hasAttribute("data-plaats")) { toonBevestiging(); return; }
    if (t.hasAttribute("data-nieuw")) { mand = {}; teken(); dlg.close(); }
  });

  var links = document.querySelectorAll("nav a");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (items) {
      items.forEach(function (it) {
        if (!it.isIntersecting) return;
        links.forEach(function (a) {
          var aan = a.dataset.r === it.target.id;
          a.classList.toggle("actief", aan);
          if (aan) { a.setAttribute("aria-current", "true"); a.closest("ul").scrollTo({ left: a.offsetLeft - 20, behavior: "smooth" }); } else a.removeAttribute("aria-current");
        });
      });
    }, { rootMargin: "-80px 0px -70% 0px" });
    document.querySelectorAll("section.rubriek").forEach(function (s) { io.observe(s); });
  }
  teken();
})();
</script>
</body>
</html>
